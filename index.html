 let last='',h='';list.forEach(({b,i})=>{if(b.theme&&b.theme!==last){h+='<h2 class="th">'+e(b.theme)+'</h2>';last=b.theme}

  const inn='<div class="cv">'+im+'</div><div class="t"><b>'+e(b.title)+'</b><span>'+e(b.name||L[cur])+'</span></div>';
  h+=cur===2?'<button class="card" onclick="ob('+i+')">'+inn+'</button>':'<a class="card" href="'+e(b.link)+'" target="_blank" rel="noopener">'+inn+'</a>'});
 if(cur===4)h='<p class="msg" style="padding:6px">4반 책은 4반 도서관이 열려요. 책장에서 같은 제목을 눌러 주세요.</p>'+h;
 g.innerHTML=h}
function ob(i){V={b:DATA[2][i],i:0};sp();document.getElementById('viewer').hidden=false}
